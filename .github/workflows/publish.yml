name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: justscale
          POSTGRES_PASSWORD: justscale
          POSTGRES_DB: justscale_test
        options: >-
          --health-cmd "pg_isready -U justscale"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - name: Cache turbo build
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Get last release tag
        id: last-tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag found, will release all packages"
            echo "tag=" >> $GITHUB_OUTPUT
            echo "ref=--first-parent" >> $GITHUB_OUTPUT
          else
            echo "Last release tag: $LAST_TAG"
            echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "ref=$LAST_TAG" >> $GITHUB_OUTPUT
          fi

      - name: Determine changed packages
        id: changed
        run: |
          if [ -z "${{ steps.last-tag.outputs.tag }}" ]; then
            # No previous tag - get all publishable packages
            CHANGED_PACKAGES=$(pnpm ls -r --depth -1 --json | jq -r '.[].name' | grep "^@justscale/" | tr '\n' ' ')
          else
            # Get changed files since last tag
            CHANGED_FILES=$(git diff --name-only ${{ steps.last-tag.outputs.ref }}..HEAD)

            # Find which packages have changes (only in /packages)
            CHANGED_PACKAGES=""
            for pkg_json in packages/*/*/package.json; do
              pkg_dir=$(dirname "$pkg_json")
              pkg_name=$(jq -r '.name' "$pkg_json")

              # Check if any file in this package directory changed
              if echo "$CHANGED_FILES" | grep -q "^$pkg_dir/"; then
                CHANGED_PACKAGES="$CHANGED_PACKAGES $pkg_name"
              fi
            done
          fi

          echo "Directly changed packages: $CHANGED_PACKAGES"
          echo "packages=$CHANGED_PACKAGES" >> $GITHUB_OUTPUT

      - name: Find dependent packages
        id: dependents
        run: |
          CHANGED="${{ steps.changed.outputs.packages }}"
          ALL_PACKAGES="$CHANGED"

          # For each changed package, find packages that depend on it (only in /packages)
          for changed_pkg in $CHANGED; do
            # Find dependents using turbo
            DEPS=$(pnpm turbo run build --filter="...^$changed_pkg" --dry-run=json 2>/dev/null | jq -r '.packages[]' | grep "^@justscale/" || true)
            for dep in $DEPS; do
              if ! echo "$ALL_PACKAGES" | grep -q "$dep"; then
                # Verify it's in /packages directory
                pkg_path=$(pnpm ls -r --depth -1 --json | jq -r ".[] | select(.name == \"$dep\") | .path")
                if echo "$pkg_path" | grep -q "/packages/"; then
                  ALL_PACKAGES="$ALL_PACKAGES $dep"
                fi
              fi
            done
          done

          # Remove duplicates and trim
          ALL_PACKAGES=$(echo "$ALL_PACKAGES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

          echo "All packages to release: $ALL_PACKAGES"
          echo "packages=$ALL_PACKAGES" >> $GITHUB_OUTPUT

      - name: Check if there are packages to release
        run: |
          if [ -z "${{ steps.dependents.outputs.packages }}" ]; then
            echo "No packages to release"
            exit 1
          fi
          echo "Packages to release: ${{ steps.dependents.outputs.packages }}"

      # ptsc (shipped by @justscale/typescript) is every other package's
      # build command. Its bin target doesn't exist on a fresh checkout,
      # so `pnpm install` doesn't link node_modules/.bin/ptsc. Bootstrap
      # the compiler first, then re-install so bin links land for every
      # consumer. Same pattern as the internal repo's ci.yml.
      - name: Bootstrap compiler
        run: pnpm --filter @justscale/typescript... build

      - name: Link binaries
        run: pnpm install --frozen-lockfile

      - name: Build changed packages
        run: |
          FILTER=""
          for pkg in ${{ steps.dependents.outputs.packages }}; do
            FILTER="$FILTER --filter=$pkg"
          done
          pnpm turbo run build $FILTER

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test changed packages
        run: |
          FILTER=""
          for pkg in ${{ steps.dependents.outputs.packages }}; do
            FILTER="$FILTER --filter=$pkg"
          done
          pnpm turbo run test $FILTER

      - name: Bump versions
        id: version
        run: |
          VERSION_TYPE=${{ inputs.version }}
          PACKAGES="${{ steps.dependents.outputs.packages }}"
          NEW_VERSION=""

          for pkg in $PACKAGES; do
            # Find package directory
            pkg_json=$(pnpm ls -r --depth -1 --json | jq -r ".[] | select(.name == \"$pkg\") | .path")/package.json

            # Get current version
            current_version=$(jq -r '.version' "$pkg_json")

            # Calculate new version
            IFS='.' read -r major minor patch <<< "$current_version"
            case $VERSION_TYPE in
              major)
                new_version="$((major + 1)).0.0"
                ;;
              minor)
                new_version="$major.$((minor + 1)).0"
                ;;
              patch)
                new_version="$major.$minor.$((patch + 1))"
                ;;
            esac

            echo "Bumping $pkg from $current_version to $new_version"

            # Update version in package.json
            jq --arg v "$new_version" '.version = $v' "$pkg_json" > tmp.json && mv tmp.json "$pkg_json"

            # Track the new version (use first package's version for tag)
            if [ -z "$NEW_VERSION" ]; then
              NEW_VERSION=$new_version
            fi
          done

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Dry-run publish
        # Validates tarball structure, missing fields, file patterns, and
        # access before we touch git. If this fails, no tag is created.
        run: |
          FILTER=""
          for pkg in ${{ steps.dependents.outputs.packages }}; do
            FILTER="$FILTER --filter=$pkg"
          done
          pnpm $FILTER publish --provenance --access public --no-git-checks --dry-run

      - name: Publish to npm
        # Auth via npm Trusted Publishing (OIDC, id-token: write above).
        # No NPM_TOKEN needed — npm picks up the GH-issued OIDC token from
        # --provenance and the registry-configured Trusted Publisher.
        run: |
          FILTER=""
          for pkg in ${{ steps.dependents.outputs.packages }}; do
            FILTER="$FILTER --filter=$pkg"
          done
          pnpm $FILTER publish --provenance --access public --no-git-checks

      - name: Commit and tag
        # Only runs if every preceding step (including the real publish)
        # succeeded, so we never push a tag for a release that didn't land.
        # If npm has the release but this step fails (e.g. push race),
        # rerun the workflow's commit/tag locally — npm publish is idempotent
        # for an already-published version (it will skip).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add packages/*/*/package.json

          PACKAGES="${{ steps.dependents.outputs.packages }}"
          git commit -m "release: v${{ steps.version.outputs.version }}

          Released packages:
          $(echo $PACKAGES | tr ' ' '\n' | sed 's/^/- /')"

          git tag "v${{ steps.version.outputs.version }}"
          git push
          git push --tags
