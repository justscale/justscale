name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: justscale
          POSTGRES_PASSWORD: justscale
          POSTGRES_DB: justscale_test
        options: >-
          --health-cmd "pg_isready -U justscale"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache turbo build
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Bootstrap compiler
        run: pnpm --filter @justscale/typescript... build

      - name: Link binaries
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo run build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test changed packages
        env:
          PGPORT: '5432'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm test:changed -- --changed=origin/${{ github.base_ref }}
          else
            pnpm test
          fi
